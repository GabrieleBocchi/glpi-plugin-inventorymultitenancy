name: Automatically tag new version

on:
  push:
    branches:
      - "main"
      - "maint-*"

jobs:
  auto-tag-new-version:
    name: "Automatically tag new version"
    permissions:
      contents: read
    uses: "GabrieleBocchi/plugin-release-workflows/.github/workflows/auto-tag-new-version.yml@75e33a4b10f7816c3054be2461dbf9ee748b6f68" # improve-security-release-workflows
    secrets:
      # A PAT is required: tags created with the GITHUB_TOKEN do not trigger the release workflow.
      github-token: ${{ secrets.AUTOTAG_TOKEN }}
